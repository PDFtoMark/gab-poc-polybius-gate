name: Polybius PR Review (PoC)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Polybius PR review
        run: |
          jq -n \
            --arg type "pr_review" \
            --arg channel "${{ secrets.POLYBIUS_CHANNEL_ID }}" \
            --arg repo "${{ github.repository }}" \
            --argjson pr_number ${{ github.event.pull_request.number }} \
            --arg event "${{ github.event.action }}" \
            --argjson wait true \
            '{type:$type,channel:$channel,repo:$repo,pr_number:$pr_number,event:$event,wait:$wait}' \
          | tee /tmp/pr_review_payload.json
          echo "--- payload the agent receives (review) ---"
          cat /tmp/pr_review_payload.json

  comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Polybius PR comment handler
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          PAYLOAD=$(jq -n \
            --arg type "pr_comment" \
            --arg channel "${{ secrets.POLYBIUS_CHANNEL_ID }}" \
            --arg repo "${{ github.repository }}" \
            --argjson pr_number ${{ github.event.issue.number }} \
            --arg comment_author "${{ github.event.comment.user.login }}" \
            --arg comment_body "$COMMENT_BODY" \
            --arg comment_url "${{ github.event.comment.html_url }}" \
            '{type:$type,channel:$channel,repo:$repo,pr_number:$pr_number,comment_author:$comment_author,comment_body:$comment_body,comment_url:$comment_url}')
          echo "AUTHOR_ASSOCIATION=${{ github.event.comment.author_association }}"
          echo "--- payload the agent receives (comment) ---"
          echo "$PAYLOAD"
          echo "MARKER_COUNT=$(printf '%s' "$PAYLOAD" | grep -c 'ATTACKER_MARKER')"
          echo "NEWLINE_IN_BODY=$(printf '%s' "$PAYLOAD" | jq -r '.comment_body' | wc -l)"
